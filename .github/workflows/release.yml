name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install extension dependencies
        working-directory: extensions/NotificationScheduler
        run: npm ci

      - name: Build extension
        working-directory: extensions/NotificationScheduler
        run: npm run build

      - name: Package extension
        env:
          ZIP_NAME: "NotificationScheduler-${{ github.ref_name }}.zip"
        run: |
          mkdir -p /tmp/release
          zip -r "/tmp/release/${ZIP_NAME}" "extensions/NotificationScheduler" \
            -x "extensions/NotificationScheduler/node_modules/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: CHANGELOG.md
          files: "/tmp/release/NotificationScheduler-${{ github.ref_name }}.zip"
