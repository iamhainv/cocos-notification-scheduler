name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install extension dependencies
        working-directory: extensions/NotificationScheduler
        run: npm ci

      - name: Build extension
        working-directory: extensions/NotificationScheduler
        run: npm run build

      - name: Type-check runtime assets
        working-directory: extensions/NotificationScheduler
        run: |
          shopt -s globstar
          npx tsc --noEmit --target es6 --module commonjs --lib dom,es7 --skipLibCheck --typeRoots ci-shims,node_modules/@types assets/**/*.ts

      - name: Check for leaked secrets
        run: bash scripts/check-secrets.sh .
