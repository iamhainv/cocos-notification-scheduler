name: Feature Request
description: Suggest an improvement for Cocos NotificationScheduler
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for suggesting an improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve? Why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions, workarounds, or existing options you've considered.
    validations:
      required: false

  - type: dropdown
    id: platform
    attributes:
      label: Platform relevance
      options:
        - Android
        - iOS
        - Both (Android + iOS)
        - Editor / build panel only
        - Not platform-specific
    validations:
      required: true
